name: Slip

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MidnightKit:
    path: MidnightKit

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    # The local native prover archive supports the arm64 simulator only.
    "ARCHS[sdk=iphonesimulator*]": arm64
    TARGETED_DEVICE_FAMILY: 1
    DEVELOPMENT_TEAM: L594CGSH6A
    CODE_SIGN_STYLE: Automatic
    LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/MidnightKit/Vendor"]

targets:
  Slip:
    type: application
    platform: iOS
    sources:
      - path: Slip
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      - path: Slip/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MidnightKit
    preBuildScripts:
      - name: Bundle local round proving artifacts
        script: |
          set -eu
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ProofArtifacts"
          mkdir -p "$DEST/zkir" "$DEST/keys" "$DEST/params"
          for circuit in enrollMember createSlip sealPick reveal settle dispute; do
            cp "${SRCROOT}/contracts/build/zkir/$circuit.zkir" "$DEST/zkir/"
            cp "${SRCROOT}/contracts/build/keys/$circuit.prover" "$DEST/keys/"
            cp "${SRCROOT}/contracts/build/keys/$circuit.verifier" "$DEST/keys/"
          done
          cp "${SRCROOT}/.build/app-proof-params/bls_midnight_2p13" "$DEST/params/"
          cp "${SRCROOT}/.build/app-proof-params/bls_midnight_2p14" "$DEST/params/"
        inputFiles:
          - $(SRCROOT)/contracts/build/zkir/sealPick.zkir
          - $(SRCROOT)/contracts/build/keys/sealPick.prover
          - $(SRCROOT)/contracts/build/keys/sealPick.verifier
          - $(SRCROOT)/contracts/build/zkir/enrollMember.zkir
          - $(SRCROOT)/contracts/build/zkir/createSlip.zkir
          - $(SRCROOT)/contracts/build/zkir/reveal.zkir
          - $(SRCROOT)/contracts/build/zkir/settle.zkir
          - $(SRCROOT)/contracts/build/zkir/dispute.zkir
          - $(SRCROOT)/contracts/build/keys/enrollMember.prover
          - $(SRCROOT)/contracts/build/keys/createSlip.prover
          - $(SRCROOT)/contracts/build/keys/reveal.prover
          - $(SRCROOT)/contracts/build/keys/settle.prover
          - $(SRCROOT)/contracts/build/keys/dispute.prover
          - $(SRCROOT)/.build/app-proof-params/bls_midnight_2p13
          - $(SRCROOT)/.build/app-proof-params/bls_midnight_2p14
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/sealPick.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/sealPick.prover
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/sealPick.verifier
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/params/bls_midnight_2p14
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/params/bls_midnight_2p13
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/enrollMember.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/createSlip.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/reveal.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/settle.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/zkir/dispute.zkir
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/enrollMember.prover
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/createSlip.prover
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/reveal.prover
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/settle.prover
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ProofArtifacts/keys/dispute.prover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sailesh.slip
        PRODUCT_NAME: Slip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Slip/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Slip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES

  SlipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SlipTests
    dependencies:
      - target: Slip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sailesh.slip.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Slip:
    build:
      targets:
        Slip: all
        SlipTests: [test]
    test:
      gatherCoverageData: true
      environmentVariables:
        SLIP_RECORD_SNAPSHOTS: $(SLIP_RECORD_SNAPSHOTS)
      targets:
        - SlipTests
