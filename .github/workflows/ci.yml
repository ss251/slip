# CI grounded in two sources (not invented):
# - official midnightntwrk repos: setup-compact-action (SHA-pinned below exactly as
#   midnightntwrk/midnight-verifiable-credentials pins it), COMPACT_COMPILER_VERSION env,
#   and `compact compile --version` as the toolchain sanity check.
# - the vendored MIDSKILLS testing skill (.agents/skills/testing/SKILL.md): compile + simulator
#   tests on every commit; local-network tests only on main; privacy/invariant tests in
#   the per-commit lane.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  COMPACT_COMPILER_VERSION: "0.31.1" # the supported stack (language 0.23.0, ledger 8, runtime 0.16.0). Per Midnight DevRel, 0.34.0 "is not currently supported by our networks" — see .claude/docs/architecture.md

jobs:
  design-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design & privacy gate
        run: sh scripts/design-gate.sh Slip

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect contract
        id: has
        run: |
          if [ -f contracts/slip.compact ]; then echo "contract=true" >> "$GITHUB_OUTPUT"; else echo "contract=false" >> "$GITHUB_OUTPUT"; echo "pre-scaffold: no contracts/ yet — lane skips"; fi
      - name: Set up Compact toolchain
        if: steps.has.outputs.contract == 'true'
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
      - name: Verify Compact installation
        if: steps.has.outputs.contract == 'true'
        run: compact compile --version
      - name: Freshness gate (toolchain/pin/pragma consistency)
        if: steps.has.outputs.contract == 'true'
        run: sh scripts/freshness-gate.sh
      - name: Compile contract
        if: steps.has.outputs.contract == 'true'
        run: compact compile contracts/slip.compact contracts/build
      - name: Simulator tests (incl. privacy-leak + invariant probes)
        if: steps.has.outputs.contract == 'true'
        working-directory: contracts
        run: npm install && npm test

  app-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iOS simulator
        id: sim
        run: |
          # Never hardcode a device name: runners rotate them, and a missing name
          # fails as "Unable to find a device matching the destination specifier",
          # which reads like a project error rather than a naming one.
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
          echo "using simulator: ${NAME:-iPhone 16}"

      - name: MidnightKit (iOS)
        run: |
          if [ ! -f MidnightKit/Package.swift ]; then echo "no MidnightKit yet — skipping"; exit 0; fi
          # MidnightKit is an iOS-only package that links a Rust staticlib. `swift test`
          # builds for the macOS HOST, which both misses the iOS platform floor and
          # cannot link an aarch64-apple-ios archive — it must be xcodebuild against a
          # simulator destination.
          if ! ls MidnightKit/Vendor/*.a >/dev/null 2>&1; then
            echo "::warning title=MidnightKit untested::Rust prover archive absent (MidnightKit/Vendor/*.a is gitignored and its source lives outside this repo), so MidnightKit is NOT covered by CI. See .claude/docs/midnightkit.md §CI coverage."
            exit 0
          fi
          cd MidnightKit && xcodebuild test -scheme MidnightKit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"

      - name: Check app test build inputs
        id: app-inputs
        run: |
          # project.yml defines the app; Slip.xcodeproj is generated and ignored.
          # Fresh clones lack the external native archive and local proof artifacts.
          missing=0
          require_input() {
            if [ ! -f "$1" ]; then
              printf 'Missing app test input: %s\n' "$1"
              missing=1
            fi
          }
          require_input MidnightKit/Vendor/libslip_prove_ffi.a
          for circuit in enrollMember createSlip sealPick reveal settle dispute; do
            require_input "contracts/build/zkir/$circuit.zkir"
            require_input "contracts/build/keys/$circuit.prover"
            require_input "contracts/build/keys/$circuit.verifier"
          done
          require_input .build/app-proof-params/bls_midnight_2p13
          require_input .build/app-proof-params/bls_midnight_2p14
          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=App tests not run::Required native archive, generated contract artifacts or staged public parameters are missing. Fresh clones do not contain these inputs; app tests are NOT covered by CI. See CONTRIBUTING.md and README.md (Build and test)."
            echo "App tests skipped: required build inputs are missing (listed in the input-check log). This is not a passing app test run. See CONTRIBUTING.md and README.md (Build and test)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: App tests
        if: steps.app-inputs.outputs.ready == 'true'
        run: |
          command -v xcodegen >/dev/null || { echo "::error::XcodeGen 2.45+ is required to generate the app project."; exit 1; }
          xcodegen generate
          xcodebuild -scheme Slip -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" test

  # local-network e2e runs on main only, not every PR
  network-e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
      - name: Start devnet
        run: |
          # --wait honours the healthchecks; the indexer also carries restart:on-failure
          # because it races the node's first block on a cold start.
          docker compose -f infra/devnet-compose.yml -p slip-devnet up -d --wait || true
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:9944/health && break; sleep 5
          done
          docker compose -f infra/devnet-compose.yml -p slip-devnet ps
      - name: Use Node 22 (midnight-js 4.1.1 needs Node 22.x or higher)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy + call on-chain
        working-directory: contracts
        run: |
          if ! grep -q '"test:network"' package.json; then echo "no network tests yet — skipping"; exit 0; fi
          # test:network builds with ZK keys, links the build into e2e/, installs that
          # workspace (midnight-js 4.1.1, kept separate from the simulator's pins),
          # then deploys and calls.
          npm install && npm run test:network
      - name: Devnet logs on failure
        if: failure()
        run: docker compose -f infra/devnet-compose.yml -p slip-devnet logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose -f infra/devnet-compose.yml -p slip-devnet down
